services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-reservaya}
      DB_USER: ${DB_USER:-reservaya}
      DB_PASSWORD: ${DB_PASSWORD:-reservaya_test}
      SESSION_SECRET: ${SESSION_SECRET:-cambia-esta-clave-en-produccion}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-reservaya}
      POSTGRES_USER: ${DB_USER:-reservaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reservaya_test}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: